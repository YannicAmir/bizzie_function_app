name: PR Checks

on:
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint TypeScript
        run: npm run lint

      - name: Lint Python (if graphs exist)
        run: |
          GRAPH_COUNT=$(python3 -c "import json; d=json.load(open('langgraph.json')); print(len(d.get('graphs', {})))")
          if [ "$GRAPH_COUNT" -gt "0" ]; then
            ruff check src/
          else
            echo "No LangGraph graphs yet — skipping Python lint"
          fi

      - name: Run Tests
        run: npm test

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r src/features/bizzie_chat/agent/requirements-dev.txt

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: Fetch Secrets from Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |
            CONFIDENT_API_KEY:${{ steps.auth.outputs.project_id }}/CONFIDENT_API_KEY

      - name: Run DeepEval Tests
        continue-on-error: true  
        env:
          CONFIDENT_API_KEY: ${{ steps.secrets.outputs.CONFIDENT_API_KEY }}
          GCLOUD_PROJECT: ${{ steps.auth.outputs.project_id }}
          APP_ENV: dev
        run: |
          cd src/features/bizzie_chat/agent
          deepeval test run tests/ -n 10 -id "PR-${{ github.event.number }}"
