name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Which environment to deploy?'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      # --- CONFIGURE ENVIRONMENT ---
      - name: Set Environment Variables (Dev)
        if: inputs.target_env == 'dev'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "FIREBASE_ALIAS=dev" >> $GITHUB_ENV
          echo "GCP_SA_KEY<<EOF" >> $GITHUB_ENV
          echo "$SA_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set Environment Variables (QA)
        if: inputs.target_env == 'qa'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QA }}
        run: |
          echo "FIREBASE_ALIAS=qa" >> $GITHUB_ENV
          echo "GCP_SA_KEY<<EOF" >> $GITHUB_ENV
          echo "$SA_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set Environment Variables (Prod)
        if: inputs.target_env == 'prod'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: |
          echo "FIREBASE_ALIAS=prod" >> $GITHUB_ENV
          echo "GCP_SA_KEY<<EOF" >> $GITHUB_ENV
          echo "$SA_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # --- AUTHENTICATE & DEPLOY ---
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Force Latest Secret Versions
        run: |
          firebase functions:secrets:use FMP_API_KEY@latest --project ${{ env.FIREBASE_ALIAS }} --force
          firebase functions:secrets:use REVENUECAT_SECRET_TOKEN@latest --project ${{ env.FIREBASE_ALIAS }} --force

      - name: Deploy to Firebase
        run: firebase deploy --only functions --project ${{ env.FIREBASE_ALIAS }} --force
