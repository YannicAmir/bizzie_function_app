name: Manual Deployment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Which environment to deploy?'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

      # --- CONFIGURE ENVIRONMENT ---
      - name: Set Environment Variables (Dev)
        if: inputs.target_env == 'dev'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          echo "FIREBASE_ALIAS=dev" >> $GITHUB_ENV
          echo "GCP_SA_KEY<<EOF" >> $GITHUB_ENV
          echo "$SA_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set Environment Variables (QA)
        if: inputs.target_env == 'qa'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QA }}
        run: |
          echo "FIREBASE_ALIAS=qa" >> $GITHUB_ENV
          echo "GCP_SA_KEY<<EOF" >> $GITHUB_ENV
          echo "$SA_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Set Environment Variables (Prod)
        if: inputs.target_env == 'prod'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: |
          echo "FIREBASE_ALIAS=prod" >> $GITHUB_ENV
          echo "GCP_SA_KEY<<EOF" >> $GITHUB_ENV
          echo "$SA_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # --- AUTHENTICATE & DEPLOY ---
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Force Latest Secret Versions
        run: |
          echo "Synchronizing secrets to latest version for project: ${{ env.FIREBASE_ALIAS }}"
          # Get all Cloud Run services in the region
          SERVICES=$(gcloud run services list --format="value(metadata.name)" --region=us-central1)
          
          for SVC in $SERVICES; do
            # Check if service uses either secret before attempting update
            # We fetch environment variable names to see if the service depends on these secrets
            ENV_VARS=$(gcloud run services describe $SVC --region=us-central1 --format="value(spec.template.spec.containers[0].env.name)")
            
            if echo "$ENV_VARS" | grep -q "FMP_API_KEY"; then
              echo "Updating FMP_API_KEY to latest for $SVC..."
              gcloud run services update $SVC --region=us-central1 --update-secrets=FMP_API_KEY=FMP_API_KEY:latest --quiet || true
            fi
            
            if echo "$ENV_VARS" | grep -q "REVENUECAT_SECRET_TOKEN"; then
              echo "Updating REVENUECAT_SECRET_TOKEN to latest for $SVC..."
              gcloud run services update $SVC --region=us-central1 --update-secrets=REVENUECAT_SECRET_TOKEN=REVENUECAT_SECRET_TOKEN:latest --quiet || true
            fi

            if echo "$ENV_VARS" | grep -q "TAVILY_API_KEY"; then
              echo "Updating TAVILY_API_KEY to latest for $SVC..."
              gcloud run services update $SVC --region=us-central1 --update-secrets=TAVILY_API_KEY=TAVILY_API_KEY:latest --quiet || true
            fi

            if echo "$ENV_VARS" | grep -q "REDIS_URL"; then
              echo "Updating REDIS_URL to latest for $SVC..."
              gcloud run services update $SVC --region=us-central1 --update-secrets=REDIS_URL=REDIS_URL:latest --quiet || true
            fi

            if echo "$ENV_VARS" | grep -q "CONFIDENT_PROJECT_NAME"; then
              echo "Updating CONFIDENT_PROJECT_NAME to latest for $SVC..."
              gcloud run services update $SVC --region=us-central1 --update-secrets=CONFIDENT_PROJECT_NAME=CONFIDENT_PROJECT_NAME:latest --quiet || true
            fi
          done

      - name: Deploy LangGraph Services to Cloud Run
        run: |
          GRAPH_COUNT=$(python3 -c "import json; d=json.load(open('langgraph.json')); print(len(d.get('graphs', {})))")
          if [ "$GRAPH_COUNT" -gt "0" ]; then
            echo "Deploying $GRAPH_COUNT LangGraph service(s) to Cloud Run..."
            python3 -c "import json; d=json.load(open('langgraph.json')); [print(k) for k in d.get('graphs', {}).keys()]" | while read GRAPH; do
              SERVICE_NAME="langgraph-$(echo "$GRAPH" | tr '_' '-')"
              echo "Deploying $SERVICE_NAME..."
              if [ "$GRAPH" = "bizzie_chat" ]; then
                CERT_SECRET=""
                if gcloud secrets describe REDIS_CA_CERT &>/dev/null 2>&1; then
                  CERT_SECRET=",REDIS_CA_CERT=REDIS_CA_CERT:latest"
                fi
                EXTRA_SECRETS=",TAVILY_API_KEY=TAVILY_API_KEY:latest,REDIS_URL=REDIS_URL:latest,FMP_API_KEY=FMP_API_KEY:latest$CERT_SECRET"
              else
                EXTRA_SECRETS=""
              fi
              PROJECT_ID=$(gcloud config get-value project)
              gcloud run deploy "$SERVICE_NAME" \
                --source ./src/features/$GRAPH/agent \
                --region us-central1 \
                --no-allow-unauthenticated \
                --max-instances=10 \
                --update-secrets=LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest,LANGSMITH_PROJECT=LANGSMITH_PROJECT:latest,LANGSMITH_ENDPOINT=LANGSMITH_ENDPOINT:latest$EXTRA_SECRETS \
                --update-env-vars=LANGSMITH_TRACING=true,LANGCHAIN_TRACING_V2=true,GCLOUD_PROJECT=${PROJECT_ID},GCP_LOCATION=us-central1 \
                --quiet

              # Capture URL and store in Secret Manager so Firebase Functions can reference it
              SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --region us-central1 --format="value(status.url)")
              SECRET_NAME="$(echo "${GRAPH}" | tr '[:lower:]' '[:upper:]')_LANGGRAPH_URL"
              if gcloud secrets describe "$SECRET_NAME" &>/dev/null 2>&1; then
                echo "Updating secret $SECRET_NAME..."
                echo -n "$SERVICE_URL" | gcloud secrets versions add "$SECRET_NAME" --data-file=-
              else
                echo "Creating secret $SECRET_NAME..."
                echo -n "$SERVICE_URL" | gcloud secrets create "$SECRET_NAME" --data-file=- --replication-policy=automatic
              fi
              echo "Set $SECRET_NAME=$SERVICE_URL"
            done
          else
            echo "No LangGraph services registered yet — skipping Cloud Run deploy"
          fi

      - name: Setup Cloud Functions Service Account
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          SA_NAME="fn-bizzie-chat"
          SA_EMAIL="${SA_NAME}@${PROJECT_ID}.iam.gserviceaccount.com"

          # Create dedicated SA if it doesn't exist (idempotent)
          if ! gcloud iam service-accounts describe "$SA_EMAIL" --quiet &>/dev/null 2>&1; then
            echo "Creating service account $SA_EMAIL..."
            gcloud iam service-accounts create "$SA_NAME" \
              --display-name="Bizzie Chat Cloud Function" \
              --quiet
          else
            echo "Service account $SA_EMAIL already exists"
          fi

          # Poll until SA is reachable (handles GCP propagation delay)
          echo "Verifying service account is reachable..."
          for i in 1 2 3 4 5; do
            if gcloud iam service-accounts describe "$SA_EMAIL" --quiet &>/dev/null 2>&1; then
              echo "Service account confirmed reachable."
              break
            fi
            WAIT=$((i * 10))
            echo "Attempt $i: not yet reachable, retrying in ${WAIT}s..."
            sleep "$WAIT"
            if [ "$i" -eq 5 ]; then
              echo "ERROR: Service account never became reachable after 5 attempts."
              exit 1
            fi
          done

          # Grant minimum required project-level roles
          # - firebase.admin: Firestore read/write, Remote Config, Firebase Auth (no standalone viewer role for Remote Config exists)
          # - secretmanager.secretAccessor: Secret Manager is GCP-level, not covered by firebase.admin
          for ROLE in roles/firebase.admin roles/secretmanager.secretAccessor; do
            echo "Binding $ROLE to $SA_EMAIL..."
            for i in 1 2 3; do
              BIND_OUTPUT=$(gcloud projects add-iam-policy-binding "$PROJECT_ID" \
                --member="serviceAccount:${SA_EMAIL}" \
                --role="$ROLE" \
                --condition=None \
                --quiet 2>&1) && break
              # Only retry on transient propagation errors, not auth/permission failures
              if echo "$BIND_OUTPUT" | grep -qE "does not exist|INVALID_ARGUMENT"; then
                WAIT=$((i * 10))
                echo "Transient propagation error on attempt $i, retrying in ${WAIT}s..."
                sleep "$WAIT"
              else
                echo "ERROR: Non-transient failure binding $ROLE: $BIND_OUTPUT"
                exit 1
              fi
              if [ "$i" -eq 3 ]; then
                echo "ERROR: Failed to bind $ROLE after 3 attempts: $BIND_OUTPUT"
                exit 1
              fi
            done
          done

          # Grant run.invoker on each LangGraph Cloud Run service specifically (not project-wide)
          GRAPH_COUNT=$(python3 -c "import json; d=json.load(open('langgraph.json')); print(len(d.get('graphs', {})))")
          if [ "$GRAPH_COUNT" -gt "0" ]; then
            python3 -c "import json; d=json.load(open('langgraph.json')); [print(k) for k in d.get('graphs', {}).keys()]" | while read GRAPH; do
              SERVICE_NAME="langgraph-$(echo "$GRAPH" | tr '_' '-')"
              echo "Granting run.invoker on $SERVICE_NAME to $SA_EMAIL..."
              gcloud run services add-iam-policy-binding "$SERVICE_NAME" \
                --region us-central1 \
                --member="serviceAccount:${SA_EMAIL}" \
                --role="roles/run.invoker" \
                --quiet
            done
          fi

          # Write the Firebase param env file so defineString('BIZZIE_CHAT_SERVICE_ACCOUNT')
          # resolves to the correct SA email at deploy time — never hardcoded in source.
          echo "BIZZIE_CHAT_SERVICE_ACCOUNT=${SA_EMAIL}" > .env.${{ env.FIREBASE_ALIAS }}

      - name: Grant Cloud Functions service agent Pub/Sub access
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format="value(projectNumber)")
          CF_AGENT="service-${PROJECT_NUMBER}@gcf-admin-robot.iam.gserviceaccount.com"
          echo "Granting roles/pubsub.admin to Cloud Functions service agent ${CF_AGENT}..."
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${CF_AGENT}" \
            --role="roles/pubsub.admin" \
            --condition=None \
            --quiet

      - name: Deploy to Firebase
        run: firebase deploy --only functions,firestore:indexes --project ${{ env.FIREBASE_ALIAS }} --force
